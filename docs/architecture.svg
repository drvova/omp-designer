<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" role="img" data-theme="dark" width="1180" height="720"
  aria-label="A flat schematic of the omp-designer runtime. The host process runs one turn: before_agent_start assembles the contract from five conditional fragments (motion, dataviz, forms, verify, workshop); the model works with its tools; designer_check renders the page and returns the diagnostics in the tool result; session_stop runs the delivery checks with one bounded repair. The turn leaves screenshots and a driver report, the canvas page and index, session traces, WORKSHOP.md and an append-only decision log. A canvas server serves the project over SSE and accepts a click at POST /workshop/decide, which is validated, logged and injected into the next turn once. The gate and the eval suite grade the session, and the deliberate limits are: no tool interception, no enforced skill reads, and a Pi adapter without the delivery backstop.">
  <title>omp-designer runtime</title>
  <style>
:root{--paper:#121316;--ink:#e9e9ec;--rule:#5a5c66;--quiet:#9a9ba4;--faint:#2a2c33;--subject:#ffffff;--fill:#1a1c20;--fill-quiet:#16181c;--accent:#7fa2ff}
.sheet{fill:var(--paper)}.host{fill:var(--fill-quiet);stroke:var(--rule);stroke-width:1;stroke-dasharray:4 3}.p-plain{fill:var(--fill);stroke:var(--rule);stroke-width:1}.p-quiet{fill:var(--fill-quiet);stroke:var(--rule);stroke-width:1;stroke-dasharray:2 3}.p-subject{fill:var(--fill);stroke:var(--subject);stroke-width:1.4}.chip-plain{fill:none;stroke:var(--rule);stroke-width:1}.chip-subject{fill:none;stroke:var(--subject);stroke-width:1.4}.t-label{fill:var(--ink);font-size:17px;font-weight:600}.t-sub{fill:var(--quiet);font-size:14px}.t-chip{fill:var(--ink);font-size:13px}.t-section{fill:var(--quiet);font-size:12px;letter-spacing:1.8px}.t-note{fill:var(--quiet);font-size:13px}.t-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.w-flow{stroke:var(--subject);stroke-width:1.3}.w-repair{stroke:var(--quiet);stroke-width:1.1;stroke-dasharray:5 4}.w-quiet{stroke:var(--rule);stroke-width:1;stroke-dasharray:2 3}
  </style>
  <defs>
    <marker id="head-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="var(--subject)"/>
    </marker>
    <marker id="head-repair" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="var(--quiet)"/>
    </marker>
    <marker id="head-quiet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="var(--rule)"/>
    </marker>
  </defs>
  <rect class="sheet" x="0" y="0" width="1180" height="720"/>
  <text class="t-label t-mono" x="60" y="52" font-size="22px">omp-designer · runtime</text>
  <text class="t-sub" x="60" y="78">One turn, what it leaves behind, and the page that answers back. Solid arrows run every turn; the dashed repair runs once; dotted lines carry a file or a read.</text>
  <line x1="60" y1="88" x2="1120" y2="88" stroke="var(--rule)" stroke-width="1"/>
  <rect class="host" x="48" y="126" width="364" height="398" rx="3"/>
  <text class="t-section t-mono" x="60" y="148">FIVE CONDITIONAL FRAGMENTS · FLAGS</text>
  <rect class="chip-plain" x="72" y="158" width="54.6" height="20" rx="2"/><text class="t-chip t-mono" x="78" y="172">motion</text>
  <rect class="chip-plain" x="134.6" y="158" width="61.7" height="20" rx="2"/><text class="t-chip t-mono" x="140.6" y="172">dataviz</text>
  <rect class="chip-plain" x="204.29999999999998" y="158" width="47.5" height="20" rx="2"/><text class="t-chip t-mono" x="210.29999999999998" y="172">forms</text>
  <rect class="chip-plain" x="259.79999999999995" y="158" width="54.6" height="20" rx="2"/><text class="t-chip t-mono" x="265.79999999999995" y="172">verify</text>
  <rect class="chip-subject" x="322.4" y="158" width="68.8" height="20" rx="2"/><text class="t-chip t-mono" x="328.4" y="172">workshop</text>
  <rect class="p-subject" x="72" y="196" width="312" height="72" rx="2"/><text class="t-label t-mono" x="84" y="217">before_agent_start</text><text class="t-sub t-mono" x="84" y="236">assembles the contract once per turn</text><text class="t-sub t-mono" x="84" y="252">injects nothing else</text>
  <rect class="p-plain" x="72" y="284" width="312" height="56" rx="2"/><text class="t-label t-mono" x="84" y="305">the model works</text><text class="t-sub t-mono" x="84" y="324">read · write · edit · bash · task</text>
  <rect class="p-plain" x="72" y="356" width="312" height="72" rx="2"/><text class="t-label t-mono" x="84" y="377">designer_check</text><text class="t-sub t-mono" x="84" y="396">renders the page, returns the</text><text class="t-sub t-mono" x="84" y="412">diagnostics in the tool result</text>
  <rect class="p-plain" x="72" y="444" width="312" height="62" rx="2"/><text class="t-label t-mono" x="84" y="465">session_stop</text><text class="t-sub t-mono" x="84" y="484">delivery checks, one bounded repair</text>
  <path class="w-flow" d="M228 268 L228 284" fill="none" marker-end="url(#head-flow)"/>
  <path class="w-flow" d="M228 340 L228 356" fill="none" marker-end="url(#head-flow)"/>
  <path class="w-flow" d="M228 428 L228 444" fill="none" marker-end="url(#head-flow)"/><text class="t-note t-mono" x="240" y="440">before it claims done</text>
  <path class="w-repair" d="M384 475 L400 475 L400 312 L384 312" fill="none" marker-end="url(#head-repair)"/>
  <text class="t-note t-mono" x="395" y="404" transform="rotate(-90 395 404)">repair, once</text>
  <text class="t-section t-mono" x="452" y="148">WHAT THE TURN LEAVES ON DISK</text>
  <rect class="p-quiet" x="452" y="164" width="320" height="64" rx="2"/><text class="t-label t-mono" x="464" y="185">screenshots/ + driver-report.json</text><text class="t-sub t-mono" x="464" y="204">1440 and 375, console, overflow, contrast</text>
  <rect class="p-quiet" x="452" y="240" width="320" height="64" rx="2"/><text class="t-label t-mono" x="464" y="261">designer-canvas.html + canvas.json</text><text class="t-sub t-mono" x="464" y="280">every board and capture on one page</text>
  <rect class="p-quiet" x="452" y="316" width="320" height="64" rx="2"/><text class="t-label t-mono" x="464" y="337">~/.omp/agent/designer-traces/</text><text class="t-sub t-mono" x="464" y="356">one JSONL per session, per working dir</text>
  <rect class="p-quiet" x="452" y="392" width="320" height="64" rx="2"/><text class="t-label t-mono" x="464" y="413">WORKSHOP.md</text><text class="t-sub t-mono" x="464" y="432">the open question, in one fenced block</text>
  <rect class="p-quiet" x="452" y="468" width="320" height="64" rx="2"/><text class="t-label t-mono" x="464" y="489">.designer/workshop-decisions.jsonl</text><text class="t-sub t-mono" x="464" y="508">append-only: what the reader chose</text>
  <text class="t-section t-mono" x="812" y="148">THE PAGE, AND THE HARNESS</text>
  <rect class="p-subject" x="812" y="164" width="320" height="168" rx="2"/><text class="t-label t-mono" x="824" y="185">canvas server · --serve</text><text class="t-sub t-mono" x="824" y="204">GET /events       SSE reload</text><text class="t-sub t-mono" x="824" y="220">GET /workshop     the open question</text><text class="t-sub t-mono" x="824" y="236">POST /workshop/decide</text><text class="t-sub t-mono" x="824" y="252"></text><text class="t-sub t-mono" x="824" y="268">serves the project; a write in the</text><text class="t-sub t-mono" x="824" y="284">same session refreshes it</text>
  <rect class="p-plain" x="812" y="348" width="320" height="100" rx="2"/><text class="t-label t-mono" x="824" y="369">the way back</text><text class="t-sub t-mono" x="824" y="388">a click is validated against the</text><text class="t-sub t-mono" x="824" y="404">options, logged beside the project,</text><text class="t-sub t-mono" x="824" y="420">and injected into the next turn once</text>
  <rect class="p-quiet" x="812" y="464" width="320" height="92" rx="2"/><text class="t-label t-mono" x="824" y="485">the gate, and the eval</text><text class="t-sub t-mono" x="824" y="504">node scripts/gate.mjs   the chain</text><text class="t-sub t-mono" x="824" y="520">evals/&lt;case&gt;/ + graders  with/without</text>
  <path class="w-quiet" d="M772 322 L790 322 L790 250 L812 250" fill="none" marker-end="url(#head-quiet)"/>
  <path class="w-flow" d="M812 392 L798 392 L798 566 L30 566 L30 232 L72 232" fill="none" marker-end="url(#head-flow)"/><text class="t-note t-mono" x="96" y="558">the reader's decision, injected into the next turn</text>
  <text class="t-section t-mono" x="48" y="608">DELIBERATE</text>
  <rect class="p-quiet" x="48" y="620" width="700" height="92" rx="2"/><text class="t-sub t-mono" x="60" y="660">· prompts and checks, never a gate: no tool call is intercepted, no skill read is enforced</text><text class="t-sub t-mono" x="60" y="676">· Pi gets the prompt and the plan checks, not the delivery backstop (the host event is OMP-only)</text><text class="t-sub t-mono" x="60" y="692">· the canvas and the driver are plain node scripts; the diagram above is built by one</text>
</svg>

